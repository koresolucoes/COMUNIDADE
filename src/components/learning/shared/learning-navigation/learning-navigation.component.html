@if (context(); as ctx) {
  <div class="pt-12 mt-12 border-t border-gray-800">
    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
      
      <!-- Previous Step -->
      <div class="w-full md:w-1/3 flex justify-center md:justify-start order-2 md:order-1">
        @if (ctx.prevStep) {
          <a [routerLink]="ctx.prevStep.path" class="group flex items-center gap-3 text-gray-400 hover:text-white transition-colors w-full md:w-auto">
            <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center group-hover:bg-gray-700 border border-gray-700 transition-colors flex-shrink-0">
              <span class="material-icons-outlined text-sm">arrow_back</span>
            </div>
            <div class="flex flex-col text-left">
              <span class="text-[10px] uppercase tracking-wider text-gray-500 group-hover:text-blue-400 font-bold">Anterior</span>
              <span class="text-sm font-medium line-clamp-1">{{ ctx.prevStep.title }}</span>
            </div>
          </a>
        }
      </div>

      <!-- Back to Path (Middle) -->
      <div class="w-full md:w-1/3 flex justify-center order-1 md:order-2">
        @if (ctx.parentPath) {
          <a [routerLink]="['/learning', ctx.parentPath.slug]" class="flex items-center gap-2 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white rounded-full transition-colors border border-gray-700">
            <span class="material-icons-outlined text-sm">grid_view</span>
            <span class="text-xs font-bold uppercase tracking-widest">Ver Trilha</span>
          </a>
        }
      </div>

      <!-- Next Step -->
      <div class="w-full md:w-1/3 flex justify-center md:justify-end order-3">
        @if (ctx.nextStep) {
          <a [routerLink]="ctx.nextStep.path" class="group flex items-center justify-end gap-3 text-gray-400 hover:text-white transition-colors w-full md:w-auto">
            <div class="flex flex-col text-right">
              <span class="text-[10px] uppercase tracking-wider text-gray-500 group-hover:text-blue-400 font-bold">Próximo</span>
              <span class="text-sm font-medium line-clamp-1">{{ ctx.nextStep.title }}</span>
            </div>
            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center group-hover:bg-blue-500 shadow-lg shadow-blue-900/20 transition-all flex-shrink-0 text-white">
              <span class="material-icons-outlined text-sm">arrow_forward</span>
            </div>
          </a>
        } @else {
            <div class="flex items-center gap-2 text-green-500 justify-end w-full md:w-auto">
                <span class="text-sm font-bold">Trilha Concluída!</span>
                <span class="material-icons-outlined">check_circle</span>
            </div>
        }
      </div>

    </div>
  </div>
}
